<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Профил — Business Commerce</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-root"></div>

<main class="container profile-layout">
  <aside>
    <div class="card card-pad profile-side">
      <img class="avatar-lg" id="profile-avatar" src="" alt="">
      <h3 id="profile-name">—</h3>
      <p style="margin:0;font-size:.85rem;" id="profile-email">—</p>
    </div>
    <nav class="profile-menu" style="margin-top:16px;">
      <a href="#info" class="active" data-tab="info"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Тағйири маълумот</a>
      <a href="#password" data-tab="password"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Тағйири парол</a>
      <a href="orders.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v2"/><path d="M3 8h18l-1.5 12.2a2 2 0 0 1-2 1.8H6.5a2 2 0 0 1-2-1.8z"/></svg> Таърихи фармоишҳо</a>
      <a href="#" id="logout-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg> Баромадан</a>
    </nav>
  </aside>

  <section>
    <div class="card card-pad" id="tab-info">
      <h3>Тағйири маълумоти шахсӣ</h3>
      <form id="profile-form" style="margin-top:18px;max-width:440px;">
        <div class="field"><label for="name">Ном</label><input type="text" id="name" required></div>
        <div class="field"><label for="email">Email</label><input type="email" id="email" disabled></div>
        <div class="field"><label for="phone">Рақами телефон</label><input type="tel" id="phone"></div>
        <div class="field"><label for="avatar_url">Пайванди акс (URL)</label><input type="url" id="avatar_url" placeholder="https://..."></div>
        <button type="submit" class="btn btn-primary">Захира кардан</button>
      </form>
    </div>

    <div class="card card-pad" id="tab-password" style="display:none;margin-top:20px;">
      <h3>Тағйири парол</h3>
      <form id="password-form" style="margin-top:18px;max-width:440px;">
        <div class="field"><label for="currentPassword">Пароли ҷорӣ</label><input type="password" id="currentPassword" required></div>
        <div class="field"><label for="newPassword">Пароли нав</label><input type="password" id="newPassword" required></div>
        <button type="submit" class="btn btn-primary">Иваз кардан</button>
      </form>
    </div>
  </section>
</main>

<div id="footer-root"></div>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
